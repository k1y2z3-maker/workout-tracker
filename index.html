<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#10141c"><meta name="apple-mobile-web-app-capable" content="yes"><title>重訓紀錄</title><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-v2.png"><link rel="stylesheet" href="./style.css"></head><body><header><small>WORKOUT TRACKER / V2.0</small><h1>重訓紀錄</h1><div class="sync-status-row"><div id="status" role="status">本機模式</div><button id="statusAction" type="button" hidden>重新授權</button></div></header><main id="app"></main><nav id="nav"><button data-tab="record">＋ 紀錄</button><button data-tab="history">歷史</button><button data-tab="progress">進度</button><button data-tab="settings">設定</button></nav><script>if(matchMedia('(display-mode: standalone)').matches||navigator.standalone){for(const type of ['gesturestart','gesturechange','gestureend'])document.addEventListener(type,e=>e.preventDefault(),{passive:false});document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});}</script><script type="module" src="./app.js"></script></body></html>
